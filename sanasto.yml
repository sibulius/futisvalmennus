# Harjoitepankin sanasto
# Harjoitteiden luokittelun sallitut arvot. Skillit ja skeematarkistus lukevat
# tätä tiedostoa – muuta termejä vain täällä.
versio: 1

# --- Kenttäalueet ----------------------------------------------------------
alueet:
  oma_kolmannes: Oma kolmannes
  keskikolmannes: Keskikolmannes
  hyokkayskolmannes: Hyökkäyskolmannes
  rangaistusalue: Rangaistusalue ja sen edusta
  koko_kentta: Koko kenttä

# --- Kaistat (vapaaehtoinen, katsotaan aina hyökkäyssuuntaan) -------------
kaistat:
  vasen_laitakaista:          { nimi: Vasen laitakaista,          lyhenne: VLK  }
  vasen_sisempi_laitakaista:  { nimi: Vasen sisempi laitakaista,  lyhenne: VSLK }
  keskikaista:                { nimi: Keskikaista,                lyhenne: KK   }
  oikea_sisempi_laitakaista:  { nimi: Oikea sisempi laitakaista,  lyhenne: OSLK }
  oikea_laitakaista:          { nimi: Oikea laitakaista,          lyhenne: OLK  }

# --- Pelin keskus ----------------------------------------------------------
pelin_keskus:
  roolit:
    hyokkaaminen:
      1H: 1. hyökkääjä     # pallollinen
      2H: 2. hyökkääjä     # lähin tuki
      3H: 3. hyökkääjä     # syvyys/leveys, kolmas pelaaja
    puolustaminen:
      1P: 1. puolustaja    # painostaa pallollista
      2P: 2. puolustaja    # tukee/peittää ykköstä
      3P: 3. puolustaja    # tasapaino, tilan peitto
  tilanteet: [1v1, 2v1, 1v2, 2v2, 3v1, 3v2, 2v3, 3v3]

# --- Paineistaminen --------------------------------------------------------
paineistaminen:
  ei: Ei paineistusta – vastustajia ei ole
  passiivinen: Vastustajat ovat mukana, mutta eivät riistä (esim. kuljettavat omaa palloa)
  puoliaktiivinen: Vastustajat saavat katkaista syöttöjä, mutta eivät riistä pallolliselta
  aktiivinen: Täysi paineistaminen ja riisto

# --- Pelin vaiheet ja alavaiheet ------------------------------------------
vaiheet:

  alkulammittely:
    nimi: Alkulämmittely
    sallitut_roolit: []
    ilman_pelin_keskusta: true     # pelin keskusta ja aluetta ei merkitä
    alavaiheet:
      dynaaminen_liikkuvuus:  { nimi: Dynaaminen liikkuvuus }
      lihasaktivointi:        { nimi: Lihasaktivointi }
      pallollinen_lammittely: { nimi: Pallollinen lämmittely }
      lammittelyleikit:       { nimi: Lämmittelyleikit }

  fysiikka:
    nimi: Fysiikka
    sallitut_roolit: []
    ilman_pelin_keskusta: true
    alavaiheet:
      nopeus:     { nimi: Nopeus }
      ketteryys:  { nimi: Ketteryys }
      voima:      { nimi: Voima }
      kestavyys:  { nimi: Kestävyys }

  tekniikka:
    nimi: Tekniikka
    sallitut_roolit: []            # tekninen drilli ilman pelin keskusta
    ilman_pelin_keskusta: true
    alavaiheet:
      vastaanotto:   { nimi: Vastaanotto }
      syottaminen:   { nimi: Syöttäminen }
      kuljettaminen: { nimi: Kuljettaminen }
      kaantyminen:   { nimi: Kääntyminen }
      ohittaminen:   { nimi: Ohittaminen }
      laukominen:    { nimi: Laukominen }
      puskeminen:    { nimi: Puskeminen }
      havainnointi:  { nimi: Havainnointi }
      pallon_suojaaminen: { nimi: Pallon suojaaminen }

  hyokkaaminen:
    nimi: Hyökkääminen
    sallitut_roolit: [1H, 2H, 3H]
    alavaiheet:
      avaaminen:
        nimi: Avaaminen
        tavoite: Pallon hallittu avaaminen omalta alueelta, ylivoiman luominen ensimmäistä prässilinjaa vastaan
        alue: oma_kolmannes
        vastinpari: prassaaminen
      rakentaminen:
        nimi: Rakentaminen
        tavoite: Pallon vieminen linjojen läpi keskialueella, pelisuunnan ja painopisteen vaihto
        alue: keskikolmannes
        vastinpari: keskialueen_puolustaminen
      murtautuminen:
        nimi: Murtautuminen
        tavoite: Puolustuslinjan rikkominen – syvyyssyötöt, juoksut selustaan, 1v1 laidoilla
        alue: hyokkayskolmannes
        vastinpari: syvyyden_puolustaminen
      viimeistely:
        nimi: Viimeistely
        tavoite: Maalintekotilanteen luominen ja hyödyntäminen – keskitykset, laukaukset, toinen pallo
        alue: rangaistusalue
        vastinpari: maalin_puolustaminen

  siirtyma_puolustukseen:
    nimi: Siirtymä puolustukseen (pallonmenetys)
    sallitut_roolit: [1H, 2H, 3H, 1P, 2P, 3P]
    alavaiheet:
      vastaprassi:
        nimi: Vastaprässi
        tavoite: Välitön takaisinriisto lähimmillä pelaajilla muutaman sekunnin ajan
        vastinpari: pallon_turvaaminen
      uudelleenjarjestaytyminen:
        nimi: Uudelleenjärjestäytyminen
        tavoite: Perääntyminen, keskustan sulkeminen ja vastahyökkäyksen hidastaminen
        vastinpari: vastahyokkays

  puolustaminen:
    nimi: Puolustaminen
    sallitut_roolit: [1P, 2P, 3P]
    alavaiheet:
      prassaaminen:
        nimi: Prässääminen
        tavoite: Vastustajan avaamisen häiritseminen, pallon riistäminen korkealla tai ohjaaminen laitaan/pitkään palloon
        alue: hyokkayskolmannes
        vastinpari: avaaminen
      keskialueen_puolustaminen:
        nimi: Keskialueen puolustaminen
        tavoite: Linjojen välien sulkeminen, pelin ohjaaminen ja riistohetken valinta
        alue: keskikolmannes
        vastinpari: rakentaminen
      syvyyden_puolustaminen:
        nimi: Syvyyden puolustaminen
        tavoite: Selustan suojaaminen, linjan hallinta, 1v1-puolustaminen laidoilla
        alue: oma_kolmannes
        vastinpari: murtautuminen
      maalin_puolustaminen:
        nimi: Maalin puolustaminen
        tavoite: Laukausten estäminen, keskitysten puolustaminen, toisen pallon voittaminen
        alue: rangaistusalue
        vastinpari: viimeistely

  siirtyma_hyokkaykseen:
    nimi: Siirtymä hyökkäykseen (pallonriisto)
    sallitut_roolit: [1H, 2H, 3H, 1P, 2P, 3P]
    alavaiheet:
      vastahyokkays:
        nimi: Vastahyökkäys
        tavoite: Nopea eteneminen riiston jälkeen vastustajan ollessa epäjärjestyksessä
        vastinpari: uudelleenjarjestaytyminen
      pallon_turvaaminen:
        nimi: Pallon turvaaminen
        tavoite: Pallon vieminen pois paineesta ja hallinnan säilyttäminen, kun vastahyökkäys ei ole mahdollinen
        vastinpari: vastaprassi

  vakiotilanne:
    nimi: Vakiotilanne
    sallitut_roolit: []            # pelin keskuksen roolit vapaaehtoisia
    puolet: [hyokkaava, puolustava]
    tehtavat: [potkaisija, heittaja, vyohyke, mies_miesta, blokkaaja, toinen_pallo, takavartija]
    alavaiheet:
      kulmapotku:      { nimi: Kulmapotku }
      vapaapotku:      { nimi: Vapaapotku }
      rajaheitto:      { nimi: Rajaheitto }
      maalipotku:      { nimi: Maalipotku }
      aloitus:         { nimi: Aloitus }
      rangaistuspotku: { nimi: Rangaistuspotku }
      # sisaanpotku:   { nimi: Sisäänpotku }   # ota käyttöön, jos ikäluokassa käytössä

  loppufysiikka:
    nimi: Loppufysiikka
    sallitut_roolit: []
    ilman_pelin_keskusta: true
    alavaiheet:
      keskivartalo:     { nimi: Keskivartalo }
      lihaskunto:       { nimi: Lihaskunto }
      loppujuoksut:     { nimi: Loppujuoksut }
      loppuverryttely:  { nimi: Loppuverryttely }

# --- Luokittelusäännöt (skillit ja CLAUDE.md) -----------------------------
saannot:
  - Harjoitteella on yksi päävaihe ja yksi alavaihe, vaikka se sivuaisi muitakin.
  - Jos harjoite opettaa selvästi myös toista alavaihetta, se merkitään kenttään myos_alavaiheet (enintään 2). Pelkkää sivuamista ei merkitä; pääluokitus ratkaisee alueen ja roolit.
  - "Rakentaminen = keskikolmanneksen vaihe, ei omalta alueelta avaamista (se on avaaminen)."
  - Tekniikka = tekninen drilli, jossa ei ole pelin vaihetta eikä pelin keskusta; alavaihe on harjoiteltava taito. Pelin keskusta ja aluetta ei merkitä, ja paineistaminen on yleensä 'ei'.
  - Alkulämmittely, fysiikka ja loppufysiikka luokitellaan kuten tekniikka – alavaihe on harjoitteen pääasiallinen sisältö, eikä pelin keskusta tai aluetta merkitä. Lämmittelyleikeissä paineistaminen voi olla muu kuin 'ei'. Loppufysiikka on harjoituksen lopuksi tehtävä fyysinen osio; muut fyysiset harjoitteet ovat fysiikkaa.
  - Pallollinen lämmittely, jonka pääsisältö on yksi tekninen taito, luokitellaan tekniikaksi; alkulämmittely-vaihe on harjoitteille, jotka on tehty nimenomaan lämmittelyksi.
  - Vakiotilanteen kuviota opettava harjoite on vakiotilanne; vakiotilanteen jälkeistä peliä opettava luokitellaan alavaiheen mukaan.
  - Roolien on kuuluttava vaiheen sallittuihin rooleihin; siirtymissä sekä H- että P-roolit ovat sallittuja.
  - Paineistaminen merkitään jokaiseen harjoitteeseen; kun paineistaminen on 'ei', vastarooleja ei ole.
  - Kaistat ovat vapaaehtoisia; merkitään vain, kun harjoite kohdistuu tiettyihin kaistoihin.
  - Ikäluokat merkitään sukupuolineutraalisti U-merkinnällä (esim. U12, U13).
  - Vasen ja oikea katsotaan aina harjoittelevan joukkueen hyökkäyssuuntaan, myös puolustusharjoitteissa.
  - Pienpeleissä kaistojen leveys suhteutetaan kenttään; jako (5 kaistaa) pysyy samana.
  - Tilanne ilmoitetaan aina hyökkääjät v puolustajat (2v1 = kaksi hyökkääjää, yksi puolustaja), myös puolustusharjoitteissa.
  - Tilanteen lukumäärä ja roolit eivät saa olla ristiriidassa (esim. 2v1 → enintään 1H–2H vastaan 1P).
