name: Tarkistus

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sanasto-ja-harjoitteet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - run: python tools/tarkista.py
